<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maldon East in 3D</title>
<style>
:root{--bg:#14181a;--fg:#e8e4d8;--dim:#9aa39c;--accent:#d9a441;--panel:rgba(20,24,26,.82)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 Georgia,serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;top:0;max-width:26rem;padding:14px max(16px,env(safe-area-inset-left,0px));background:var(--panel)}
h1{font-size:1.15rem;margin:0 0 .3rem;font-weight:normal;letter-spacing:.04em}
p{margin:.3rem 0;color:var(--dim);font-size:.85rem}
label{display:flex;gap:.6rem;align-items:center;font-size:.85rem;margin-top:.5rem}
input[type=range]{flex:1}
.tag{position:fixed;pointer-events:none;transform:translate(-50%,-100%);font-size:.75rem;padding:2px 6px;background:var(--panel);border-left:2px solid var(--accent);white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
<h1>Maldon East, from LIDAR</h1>
<p>Terrain as it is today (Environment Agency 1 m LIDAR, 2022, shown at 2 m). The 1990 bypass and later building are in it; the 1980s ground is not. Drag to orbit, scroll to zoom.</p>
<label for="ex">Height exaggeration <input id="ex" type="range" min="1" max="8" step="0.5" value="3"></label>
<p>Grid positions are from the county survey (TL references, ±70 m) and are approximate.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async()=>{
const meta=await (await fetch('heights.json')).json();
const buf=new Uint16Array(await (await fetch('heights.bin')).arrayBuffer());
const {w,h,cell,e0,n1,lo,hi}=meta;
const H=(i,j)=>lo+buf[i*w+j]/65535*(hi-lo);
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x14181a);S.fog=new THREE.Fog(0x14181a,900,2200);
const cam=new THREE.PerspectiveCamera(50,1,1,5000);
const ctl=new THREE.OrbitControls(cam,canvas);ctl.maxPolarAngle=1.5;
const geo=new THREE.BufferGeometry();
const pos=new Float32Array(w*h*3),col=new Float32Array(w*h*3),idx=[];
for(let i=0;i<h;i++)for(let j=0;j<w;j++){
  const k=(i*w+j)*3,y=H(i,j);pos[k]=j*cell;pos[k+1]=y;pos[k+2]=i*cell;
  const t=Math.min(1,Math.max(0,(y-lo)/(hi-lo)));
  const c=new THREE.Color().setHSL(.28-.2*t,.28,.28+.3*t);col[k]=c.r;col[k+1]=c.g;col[k+2]=c.b;
  if(i<h-1&&j<w-1){const a=i*w+j;idx.push(a,a+w,a+1,a+1,a+w,a+w+1);}
}
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
geo.setIndex(idx);geo.computeVertexNormals();
const mesh=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true}));
S.add(mesh);
S.add(new THREE.HemisphereLight(0xdfe6ee,0x30352f,.7));
const sun=new THREE.DirectionalLight(0xfff0d0,.9);sun.position.set(-400,600,-300);S.add(sun);
// survey positions (BNG) -> scene
const P=(e,n)=>{const x=e-e0,z=n1-n;const j=Math.min(w-1,Math.max(0,Math.round(x/cell))),i=Math.min(h-1,Math.max(0,Math.round(z/cell)));return new THREE.Vector3(x,H(i,j),z);};
const marks=[
 ['Maldon East station (TL 855075)',585500,207500],
 ['Branch junction (TL 850076)',585000,207600]
];
const tags=marks.map(([t,e,n])=>{
  const p=P(e,n);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,40,8),new THREE.MeshBasicMaterial({color:0xd9a441}));
  m.position.set(p.x,p.y+20,p.z);S.add(m);
  const d=document.createElement('div');d.className='tag';d.textContent=t;document.body.appendChild(d);
  return {p,m,d};
});
const ex=document.getElementById('ex');
const setEx=()=>{mesh.scale.y=+ex.value;tags.forEach(({p,m})=>{m.position.y=p.y*ex.value+20;});};ex.oninput=setEx;setEx();
const cx=w*cell/2,cz=h*cell/2;
ctl.target.set(cx,5,cz);cam.position.set(cx-250,320,cz+520);
function size(){const W=innerWidth,Hh=innerHeight;R.setSize(W,Hh,false);cam.aspect=W/Hh;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const v=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);ctl.update();R.render(S,cam);
  tags.forEach(({p,d})=>{v.set(p.x,p.y*ex.value+50,p.z).project(cam);
    d.style.display=v.z<1?'block':'none';d.style.left=(v.x+1)/2*innerWidth+'px';d.style.top=(1-v.y)/2*innerHeight+'px';});
})();
})();
</script>
</body>
</html>
